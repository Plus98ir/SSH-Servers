<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSH Servers">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Your SSH servers on the phone, synced with the SSH Servers app on Windows.">
<title>SSH Servers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Vazirmatn;font-weight:400;font-display:swap;src:url(fonts/Vazirmatn-Regular.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:500;font-display:swap;src:url(fonts/Vazirmatn-Medium.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:700;font-display:swap;src:url(fonts/Vazirmatn-Bold.woff2) format('woff2')}
:root{
  --bg:#0c0f13;--panel:#141820;--card:#191e27;--card-h:#202632;
  --line:#262c38;--line-h:#384154;--text:#eceef4;--muted:#8a91a6;--dim:#5d6479;
  --accent:#22c38e;--accent-2:#1a9bd7;--ok:#2fd27a;--warn:#ffb648;--danger:#ff5b6e;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:Vazirmatn,system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--text);font-size:15px;min-height:100vh;min-height:100dvh;
  background:radial-gradient(900px 420px at 85% -10%,rgba(34,195,142,.13),transparent 60%),radial-gradient(700px 380px at 0% 110%,rgba(26,155,215,.12),transparent 60%),var(--bg);background-attachment:fixed}
main{width:100%;padding:calc(env(safe-area-inset-top) + 24px) 32px calc(env(safe-area-inset-bottom) + 28px)}
@media (max-width:640px){main{padding-left:16px;padding-right:16px;padding-top:calc(env(safe-area-inset-top) + 16px)}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 22px rgba(34,195,142,.3)}
.logo svg{width:24px;height:24px}
h1{font-size:18px;font-weight:700;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.ib{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px}
.ib .sd{position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--dim)}
.ib.on .sd{background:var(--ok)}.ib.err .sd{background:var(--danger)}.ib.busy svg{animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;animation:in .25s ease both}
.card:active{transform:scale(.97);background:var(--card-h)}
@media (hover:hover){.card:hover{background:var(--card-h);border-color:var(--line-h)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:10px;position:relative;color:#fff;font-weight:700;font-size:20px}
.name{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.more{position:absolute;top:6px;inset-inline-end:6px;width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer}
.more svg{width:18px;height:18px}.more:active{background:rgba(255,255,255,.08)}
.add{border-style:dashed;justify-content:center;color:var(--muted);min-height:132px}
.add .plus{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);margin-bottom:8px}
.add .plus svg{width:22px;height:22px}
.empty{grid-column:1/-1;color:var(--dim);font-size:13px;text-align:center;padding:8px}
.btn{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:rgba(255,255,255,.07);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#04140e}.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.6}
input{font:inherit;font-size:16px;color:var(--text);background:#0e1218;border:1px solid var(--line-h);border-radius:12px;padding:11px 12px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.ltr{direction:ltr;text-align:left}
.row input{min-width:0}.brand>div{min-width:0}h1,.sub{overflow:hidden;text-overflow:ellipsis}.sub{white-space:nowrap}
.setup,.grid,.card{min-width:0;max-width:100%}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.62);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:#161a23;border:1px solid var(--line-h);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line-h)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{font-size:17px;margin-bottom:12px}
.sheet p{color:var(--muted);font-size:13.5px;line-height:1.85;margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.three{display:grid;grid-template-columns:1fr 1.4fr 84px;gap:8px}
.sw-row{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.swatch.sel{border-color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.list button{font:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.04);border:0;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:start}
.list button svg{width:19px;height:19px;color:var(--muted);flex:none}
.list button.del{color:var(--danger)}.list button.del svg{color:var(--danger)}
.note{font-size:12.5px;color:var(--dim);line-height:1.8}
.sstat{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;line-height:1.7}
.sstat .d{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.sstat.err .d{background:var(--danger)}.sstat.off .d{background:var(--dim)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text)}
.cmd{font-family:var(--mono);font-size:12.5px;background:#0e1218;border-radius:10px;padding:10px 12px;direction:ltr;text-align:left;color:var(--muted);margin-bottom:14px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);background:#1e2430;border:1px solid var(--line-h);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:calc(100% - 32px);text-align:center;line-height:1.7}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:rgba(255,91,110,.55)}
.setup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.ghb{width:100%;padding:13px;font-weight:700;background:#f0f3f6;color:#0d1117}
.ucode{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:4px;text-align:center;direction:ltr;background:#0e1218;border-radius:12px;padding:14px;margin:4px 0 14px;user-select:all}
.guide h4{font-size:14.5px;margin:14px 0 6px;color:var(--text)}.guide h4:first-child{margin-top:0}
.guide ol{color:var(--muted);font-size:13.5px;line-height:1.9;padding-inline-start:20px;margin-bottom:6px}.guide b{color:var(--text);font-weight:500}
.setup h2{font-size:16px;margin-bottom:8px}
.setup p{color:var(--muted);font-size:13.5px;line-height:1.85;margin-bottom:12px}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5"/><path d="M12 18h7"/></svg></div>
      <div><h1 data-i18n="title"></h1><div class="sub" data-i18n="subtitle"></div></div>
    </div>
    <div class="hright">
      <button class="ib" id="syncBtn" aria-label="Sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg><span class="sd"></span></button>
      <button class="ib" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </header>
  <div id="setup"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script data-goatcounter="https://plus98.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="https://corenetbase.com/support.js" data-float="0" defer></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
