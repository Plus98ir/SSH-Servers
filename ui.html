<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>SSH Servers</title>
<style>
/*FONTS*/
:root{
  --bg:#0c0f13; --panel:#141820; --card:#191e27; --card-h:#202632;
  --line:#262c38; --line-h:#384154; --text:#eceef4; --muted:#8a91a6; --dim:#5d6479;
  --accent:#22c38e; --accent-2:#1a9bd7; --ok:#2fd27a; --warn:#ffb648; --danger:#ff5b6e;
  --r:18px; --mono:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;color:var(--text);font-size:14px;user-select:none;overflow:hidden;
  background:
    radial-gradient(900px 420px at 85% -10%, rgba(34,195,142,.13), transparent 60%),
    radial-gradient(700px 380px at 0% 110%, rgba(26,155,215,.12), transparent 60%),
    var(--bg);
}
.app{height:100%;display:flex;flex-direction:column;padding:22px 24px 16px}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 22px rgba(34,195,142,.3)}
.logo svg{width:24px;height:24px}
h1{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}

.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;padding:4px 2px 8px;margin:0 -2px}
.grid::-webkit-scrollbar{width:8px}.grid::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.card{position:relative;height:200px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  transition:transform .15s, background .15s, border-color .15s, box-shadow .15s;animation:pop .28s ease both}
.card:hover{transform:translateY(-3px);background:var(--card-h);border-color:var(--line-h);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.card:active{transform:translateY(-1px) scale(.985)}
.card.launch{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,195,142,.18)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

.avatar{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;position:relative;color:#fff}
.avatar svg{width:28px;height:28px}
.avatar .ini{position:absolute;bottom:-6px;inset-inline-end:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:#0c0f13;
  border:2px solid var(--card);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--text)}
.name{font-weight:700;font-size:16px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.04)}
.stat .d{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.stat.up .d{background:var(--ok);box-shadow:0 0 0 3px rgba(47,210,122,.15)}
.stat.slow .d{background:var(--warn)}
.stat.down{color:#ffb0b8}.stat.down .d{background:var(--danger)}
.stat.wait .d{animation:blink 1s infinite}
.stats{display:flex;gap:6px;align-items:center}
.kchip{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;color:#bff3df;background:rgba(34,195,142,.14)}
.kchip svg{width:13px;height:13px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--dim);line-height:1.8;margin:-4px 0 12px}
.okbig{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px;background:rgba(34,195,142,.15);color:var(--accent)}
.okbig svg{width:28px;height:28px}
.center{text-align:center}
@keyframes blink{50%{opacity:.25}}

.more{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;opacity:0;transition:.15s}
.card:hover .more{opacity:1}.more:hover{background:rgba(255,255,255,.07);color:var(--text)}
.more svg{width:18px;height:18px}
.key{position:absolute;top:10px;inset-inline-start:12px;font-size:11px;color:var(--dim);font-family:var(--mono)}

.add{border-style:dashed;background:transparent}.add:hover{background:rgba(255,255,255,.025)}
.plus{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--muted)}
.plus svg{width:26px;height:26px}
.add .label{color:var(--muted);font-weight:500}

.btn{font:inherit;font-size:13px;font-weight:500;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;
  background:rgba(255,255,255,.07);color:var(--text);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);color:#04140e}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff}
.btn svg{width:16px;height:16px}

input{font:inherit;color:var(--text);background:#0e1218;border:1px solid var(--line-h);border-radius:10px;padding:8px 10px;outline:none;width:100%}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,195,142,.18)}
input.ltr{direction:ltr;text-align:left;font-family:var(--mono);font-size:13px}

.menu{position:fixed;z-index:20;min-width:160px;background:#1c212c;border:1px solid var(--line-h);border-radius:12px;padding:6px;
  box-shadow:0 14px 34px rgba(0,0,0,.45);display:none}
.menu.show{display:block;animation:pop .15s ease}
.menu button{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:13px;color:var(--text);background:transparent;
  border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start}
.menu button:hover{background:rgba(255,255,255,.07)}
.menu button.del{color:#ff8b98}
.menu svg{width:16px;height:16px;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);display:none;align-items:center;justify-content:center;z-index:30}
.scrim.show{display:flex}
.modal{width:380px;background:#161a23;border:1px solid var(--line-h);border-radius:16px;padding:20px;animation:pop .18s ease}
.modal h3{font-size:16px;margin-bottom:12px}
.modal p{color:var(--muted);font-size:13px;line-height:1.8;margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.sw-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.12s}
.swatch.sel{border-color:#fff;transform:scale(1.08)}
.preview{font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;text-align:left;background:#0e1218;border-radius:8px;padding:7px 10px;margin:4px 0 14px}
.row{display:flex;gap:8px}

footer{display:flex;align-items:center;gap:20px;padding-top:12px;margin-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.toggle{display:flex;align-items:center;gap:9px;cursor:pointer}
.sw{width:36px;height:20px;border-radius:999px;background:#2a3040;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#aab1c3;transition:.2s}
.toggle.on .sw{background:var(--accent)}.toggle.on .sw::after{inset-inline-start:19px;background:#fff}

.toast{position:fixed;left:50%;bottom:58px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#222836;
  border:1px solid var(--line-h);border-radius:12px;padding:10px 16px;font-size:13px;max-width:560px;text-align:center;line-height:1.8;
  transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,91,110,.5)}
.hright{display:flex;align-items:center;gap:10px}
header{cursor:default}
.wctl{display:flex;gap:4px;margin-inline-start:4px}
.wctl button{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.12s}
.wctl button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.wctl button.x:hover{background:#e5484d;color:#fff}
.wctl svg{width:16px;height:16px}
.sbtn{position:relative;width:34px;height:34px;padding:0;justify-content:center}
.sbtn .sd{position:absolute;top:6px;inset-inline-end:6px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sbtn.on .sd{background:var(--ok)}.sbtn.err .sd{background:var(--danger)}.sbtn.busy svg{animation:sp 1.2s linear infinite}
.qr{display:block;width:190px;height:190px;margin:4px auto 10px;border-radius:12px;background:#fff;padding:8px;image-rendering:pixelated}
.linkrow{display:flex;gap:8px;margin-bottom:12px}.linkrow input{flex:1;font-family:var(--mono);font-size:11.5px}
.sstat{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sstat .d{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.sstat.err .d{background:var(--danger)}
.modal h4{font-size:13.5px;margin:12px 0 6px}.modal h4:first-child{margin-top:0}
.modal ol{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 12px;padding-inline-start:20px}
.modal a{color:var(--accent);text-decoration:none;cursor:pointer}
.ghb{width:100%;justify-content:center;padding:11px;font-weight:700;background:#f0f3f6;color:#0d1117;margin-bottom:6px}.ghb:hover{background:#fff}
.ucode{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:4px;text-align:center;direction:ltr;background:#0e1218;border-radius:12px;padding:14px;margin:4px 0 12px;user-select:text}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{font:inherit;font-size:12px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer}
.lang button.on{background:rgba(255,255,255,.1);color:var(--text)}
.modal.wide{width:680px}
.modal{max-height:calc(100vh - 32px);overflow-y:auto}
.modal::-webkit-scrollbar{width:8px}.modal::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;font-size:13px;transition:.12s}
.pick .cb{width:16px;height:16px;border-radius:5px;border:2px solid var(--dim);display:grid;place-items:center}
.pick.on{border-color:var(--accent);background:rgba(34,195,142,.08)}
.pick.on .cb{border-color:var(--accent);background:var(--accent)}
.pick.on .cb::after{content:"";width:6px;height:3px;border:2px solid #04140e;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pick .cdot{width:9px;height:9px;border-radius:3px}
.sec{font-size:12.5px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.cmdrow{display:flex;gap:8px}
.cmdrow input{flex:1}
.results{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.res{border:1px solid var(--line);border-radius:12px;background:#10141b;overflow:hidden}
.res .rh{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.res .rh b{font-weight:700}
.res .rs{margin-inline-start:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.res .rs.ok{color:#9ff0c7}.res .rs.bad{color:#ffb0b8}
.res pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;color:#d5d9e3;direction:ltr;text-align:left;
  white-space:pre-wrap;word-break:break-all;max-height:170px;overflow:auto;user-select:text}
.res pre:empty::before{content:"—";color:var(--dim)}
.mini{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:sp .8s linear infinite}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:14px 0 4px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5"/><path d="M12 18h7"/></svg></div>
      <div><h1 data-i18n="title"></h1><div class="sub" data-i18n="subtitle"></div></div>
    </div>
    <div class="hright"><button class="btn sbtn" id="syncBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg><span class="sd"></span></button><div class="lang" id="lang"><button data-l="fa">فا</button><button data-l="en">EN</button></div><button class="btn" id="allBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4"/></svg><span data-i18n="multi"></span></button><div class="wctl"><button id="wMin" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button id="wClose" class="x" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <div class="toggle" id="tSame"><div class="sw"></div><span data-i18n="sameWindow"></span></div>
    <div class="toggle" id="tClose"><div class="sw"></div><span data-i18n="autoClose"></span></div>
  </footer>
</div>

<div class="menu" id="menu">
  <button id="mEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span data-i18n="mEdit"></span></button>
  <button id="mKey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg><span data-i18n="mKey"></span></button>
  <button id="mUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span data-i18n="mUp"></span></button>
  <button id="mDown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="mDown"></span></button>
  <hr>
  <button id="mDel" class="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span data-i18n="mDel"></span></button>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const L={
 fa:{syHelp:'راهنما',syHelpT:'راهنمای سینک',syHelpB:`<h4>سینک چیه؟</h4><p>لیست سرورهات روی کامپیوتر و گوشی (و هر کامپیوتر دیگه) یکی می‌شه. اختیاریه؛ بدون سینک هم برنامه مثل قبل کار می‌کنه.</p>
<h4>راه‌اندازی (یک بار)</h4><ol><li>«ورود با GitHub» رو بزن. صفحهٔ GitHub باز می‌شه و کد برات کپی شده؛ Paste کن و Authorize رو بزن. حساب GitHub نداری؟ همون‌جا با یه ایمیل رایگان بساز.</li>
<li>QR که نشون داده می‌شه رو با دوربین گوشی اسکن کن؛ صفحهٔ گوشی باز می‌شه و وصله.</li>
<li>روی گوشی از منوی مرورگر «Add to Home screen» رو بزن تا مثل اپ نصب بشه. برای باز کردن سرورها یه اپ SSH مثل Termius یا ConnectBot لازمه.</li>
<li>کامپیوتر دوم؟ «لینک سینک» رو از همین صفحه کپی کن و توی بخش سینک اون کامپیوتر بذار.</li></ol>
<h4>بعدش</h4><ol><li>خودکاره: موقع باز کردن برنامه، چند ثانیه بعد از هر تغییر و هر ۱ دقیقه. دکمهٔ «همین الان سینک کن» برای سینک دستیه.</li>
<li>همیشه آخرین تغییر برنده‌ست؛ دستگاهی که چند روز بسته بوده اطلاعات قدیمی رو برنمی‌گردونه.</li>
<li>فقط اسم، آدرس، پورت، یوزر و رنگ می‌ره، رمزنگاری‌شده و روی GitHub خودت. پسورد و کلید SSH هیچ‌جا نمی‌رن.</li></ol>`,syLogin:'ورود با GitHub',syOr:'یا با توکن / لینک سینک:',syCode:'این کد رو توی صفحه‌ای که باز شد وارد کن و Authorize رو بزن:',syWait:'منتظر تأیید GitHub…',syncTip:'سینک با گوشی و دستگاه‌های دیگه',syTitle:'سینک لیست سرورها',syIntro:'لیست سرورها (اسم، آدرس، پورت، یوزر و رنگ) رمزنگاری‌شده توی یه Gist مخفی روی GitHub خودت ذخیره می‌شه. پسورد و کلید SSH هیچ‌وقت جایی فرستاده نمی‌شن.',syStep1:'یه توکن GitHub بساز (فقط تیک gist لازمه):',syMake:'ساخت توکن',syStep2:'توکن رو اینجا بذار. اگه قبلاً روی یه دستگاه دیگه سینک رو روشن کردی، به جای توکن «لینک سینک» اون دستگاه رو بذار.',syPh:'ghp_… یا لینک سینک',syGo:'روشن کردن سینک',syBusy:'در حال وصل شدن…',syExists:'روی این حساب GitHub قبلاً سینک ساخته شده. «لینک سینک» رو از دستگاه دیگه (بخش سینک) بیار و اینجا بذار. اگه اون دستگاه رو نداری، از نو بساز؛ لیست این کامپیوتر جای قبلی رو می‌گیره.',syReplace:'از نو بساز',syOn:'سینک روشنه',syLast:'آخرین سینک: {n}',syNever:'هنوز سینک نشده',syPhone:'روی گوشی این QR رو با دوربین اسکن کن (یا لینک رو برای خودت بفرست)، بعد توی مرورگر «Add to Home screen» رو بزن:',syCopy:'کپی',syCopied:'لینک کپی شد',syWarn:'این لینک مثل رمزه؛ به کسی نده.',syNow:'همین الان سینک کن',syOff:'خاموش کردن',syOffQ:'سینک روی این کامپیوتر خاموش بشه؟ لیست سرورها همین‌جا می‌مونه.',syDone:'سینک شد',syGot:'لیست سرورها از دستگاه دیگه به‌روز شد',justNow:'همین الان',minAgo:'{n} دقیقه پیش',title:'سرورهای SSH',subtitle:'روی یه سرور کلیک کن تا مستقیم توی Terminal وصل بشی',openAll:'همه با هم',multi:'چند سرور با هم',multiTitle:'چند سرور با هم',multiPick:'سرورها رو انتخاب کن:',all:'همه',none:'هیچ‌کدوم',splitBtn:'باز کردن کنار هم (Split)',tabsBtn:'باز کردن توی تب‌ها',splitNote:'نکته: توی Terminal با Ctrl+Shift+P و نوشتن broadcast می‌تونی هر چی تایپ می‌کنی همزمان بره توی همهٔ پنجره‌ها.',cmdSec:'اجرای یه دستور روی همه',cmdPh:'مثلاً uptime یا apt update',run:'اجرا',cmdNote:'برای اجرای دستور، «ورود بدون رمز» باید روی اون سرورها  en:{syHelp:'Guide',syHelpT:'Sync guide',syHelpB:`<h4>What is sync?</h4><p>Your server list becomes the same on your PC, your phone and any other PC. It’s optional; without it the app works as before.</p>
<h4>Setup (once)</h4><ol><li>Press “Sign in with GitHub”. GitHub opens and the code is already copied — paste it and press Authorize. No GitHub account? Create one for free right there (just an email).</li>
<li>Scan the QR that appears with your phone camera; the phone page opens already connected.</li>
<li>On the phone use “Add to Home screen” in the browser menu to install it like an app. To open servers you need an SSH app such as Termius or ConnectBot.</li>
<li>Another PC? Copy the “sync link” from this window and paste it into that PC’s sync box.</li></ol>
<h4>After that</h4><ol><li>It’s automatic: when the app opens, a few seconds after every change, and every minute. “Sync now” syncs by hand.</li>
<li>The newest change always wins; a device closed for days never brings old data back.</li>
<li>Only name, address, port, user and color are sent — encrypted, on your own GitHub. Passwords and SSH keys never leave the PC.</li></ol>`,syLogin:'Sign in with GitHub',syOr:'or use a token / sync link:',syCode:'Enter this code on the page that just opened and press Authorize:',syWait:'Waiting for GitHub…',syncTip:'Sync with your phone and other devices',syTitle:'Sync the server list',syIntro:'The server list (name, address, port, user and color) is kept encrypted in a secret Gist on your own GitHub. Passwords and SSH keys are never sent anywhere.',syStep1:'Create a GitHub token (only the gist box is needed):',syMake:'Create token',syStep2:'Paste the token here. If sync is already on for another device, paste that device’s “sync link” instead.',syPh:'ghp_… or a sync link',syGo:'Turn on sync',syBusy:'Connecting…',syExists:'Sync already exists on this GitHub account. Bring the “sync link” from your other device (its Sync section) and paste it here. If you don’t have that device, start over — this PC’s list replaces the old one.',syReplace:'Start over',syOn:'Sync is on',syLast:'Last sync: {n}',syNever:'Not synced yet',syPhone:'On your phone scan this QR with the camera (or send yourself the link), then tap “Add to Home screen” in the browser:',syCopy:'Copy',syCopied:'Link copied',syWarn:'This link works like a password — don’t share it.',syNow:'Sync now',syOff:'Turn off',syOffQ:'Turn sync off on this PC? The server list stays here.',syDone:'Synced',syGot:'Server list updated from another device',justNow:'just now',minAgo:'{n} min ago',title:'SSH Servers',subtitle:'Click a server to connect straight in Windows Terminal',openAll:'Open all',multi:'Multiple servers',multiTitle:'Multiple servers',multiPick:'Pick the servers:',all:'All',none:'None',splitBtn:'Open side by side (Split)',tabsBtn:'Open in tabs',splitNote:'Tip: in Terminal press Ctrl+Shift+P and type broadcast to send what you type to every pane at once.',cmdSec:'Run one command on all of them',cmdPh:'e.g. uptime or apt update',run:'Run',cmdNote:'Running commands needs “Passwordless login” set up on those servers. 90 seconds max.',running:'Running…',exitOk:'OK · {n}',exitBad:'exit code {n}',errShort:'Error',secs:'{n}s',pickOne:'Select at least one server',

};
let lang='fa';
const t=(k,n)=>{ let v=(L[lang]&&L[lang][k])||L.fa[k]||k; return n===undefined?v:v.replace('{n}',n); };
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
}
const grid=$('#grid');
const COLORS=['#C00000','#E8590C','#F2B705','#008000','#12B886','#1C7ED6','#7048E8','#D6336C','#495057'];
let st={servers:[],sameWindow:true,autoClose:true,wtFound:true};
let ping={};          // id -> ms (-1 down, undefined pending)
let menuFor=null;

const ICON_SRV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>';
const ICON_KEY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg>';
const ICON_MORE='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
const ICON_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addr=s=>(s.user?s.user+'@':'')+s.host+(s.port&&s.port!=22?':'+s.port:'');
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  const c=v=>Math.max(0,Math.min(255,v));return `rgb(${c(r)},${c(g)},${c(b)})`;}
const fa=n=>lang==='fa'?String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]):String(n);

let tt;function toast(m,k='',ms=3000){const t=$('#toast');t.textContent=m;t.className='toast show '+k;clearTimeout(tt);tt=setTimeout(()=>t.className='toast '+k,ms);}

function statHTML(id){
  const p=ping[id];
  if(p===undefined) return '<span class="stat wait"><span class="d"></span>'+t('checking')+'</span>';
  if(p<0) return '<span class="stat down"><span class="d"></span>'+t('down')+'</span>';
  return `<span class="stat ${p>250?'slow':'up'}"><span class="d"></span>${t('ms',fa(p))}</span>`;
}

function render(){
  $('#tSame').classList.toggle('on',st.sameWindow);
  $('#tClose').classList.toggle('on',st.autoClose);
  $('#allBtn').style.display=st.servers.length>1?'':'none';
  let h='';
  st.servers.forEach((s,i)=>{
    const c=s.color||'#495057';
    h+=`<div class="card" data-id="${esc(s.id)}" style="animation-delay:${i*25}ms">
      ${i<9?`<span class="key">${i+1}</span>`:''}
      <button class="more" data-more="${esc(s.id)}">${ICON_MORE}</button>
      <div class="avatar" style="background:linear-gradient(140deg,${shade(c,40)},${shade(c,-25)})">${ICON_SRV}<span class="ini">${esc(([...s.name][0]||'?').toUpperCase())}</span></div>
      <div class="name">${esc(s.name)}</div>
      <div class="addr">${esc(addr(s))}</div>
      <div class="stats">${statHTML(s.id)}${s.keyOK?`<span class="kchip" title="${t('noPassTip')}">${ICON_KEY}${t('noPass')}</span>`:''}</div>
    </div>`;
  });
  h+=`<div class="card add" id="addCard"><div class="plus">${ICON_PLUS}</div><div class="label">${t('newServer')}</div></div>`;
  if(!st.servers.length) h+='<div class="empty">'+t('empty')+'</div>';
  grid.innerHTML=h;
  fit();
}
let lastFit='';
function fit(big){
  const n=st.servers.length+1, rows=Math.min(3,Math.ceil(n/3));
  const app=getComputedStyle(document.querySelector('.app'));
  const hdr=document.querySelector('header'), ftr=document.querySelector('footer');
  const gridH=rows*200+(rows-1)*16+12;
  let h=parseFloat(app.paddingTop)+parseFloat(app.paddingBottom)+hdr.offsetHeight+18+gridH+ftr.offsetHeight+6+4;
  if(big||$('#scrim').classList.contains('show')&&$('#modal').classList.contains('wide')) h=Math.max(h,660);
  else if($('#scrim').classList.contains('show')) h=Math.max(h,560);
  const key=Math.round(h)+'';
  if(key===lastFit) return; lastFit=key;
  try{ window.fitWindow(800,Math.round(h),window.devicePixelRatio||1); }catch(e){}
}

async function load(){ try{ st=await window.getState(); }catch(e){} if(st.lang&&st.lang!==lang){ lang=st.lang; } applyLang(); render(); }
function doPing(){ ping={}; render(); try{ window.pingAll(); }catch(e){} }
window.onPing=(id,ms)=>{ ping[id]=ms; const card=grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(card){ const old=card.querySelector('.stat'); old.outerHTML=statHTML(id); } };

async function doConnect(id){
  const card=grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`); card&&card.classList.add('launch');
  try{ await window.connect(id,false); const s=st.servers.find(x=>x.id===id); toast(t('connecting',s?s.name:''),'',2200); }
  catch(e){ toast(String(e.message||e),'err',4500); }
  setTimeout(()=>card&&card.classList.remove('launch'),900);
}

grid.addEventListener('click',e=>{
  const m=e.target.closest('[data-more]');
  if(m){ e.stopPropagation(); showMenu(m.dataset.more,m.getBoundingClientRect()); return; }
  if(e.target.closest('#addCard')){ editor(null); return; }
  const c=e.target.closest('.card[data-id]'); if(c) doConnect(c.dataset.id);
});
grid.addEventListener('contextmenu',e=>{
  const c=e.target.closest('.card[data-id]'); if(!c) return; e.preventDefault();
  showMenu(c.dataset.id,{left:e.clientX,top:e.clientY,bottom:e.clientY});
});

function showMenu(id,r){
  menuFor=id; const m=$('#menu'); m.classList.add('show');
  const i=st.servers.findIndex(s=>s.id===id);
  $('#mUp').style.display=i>0?'':'none'; $('#mDown').style.display=i<st.servers.length-1?'':'none';
  const w=m.offsetWidth,hh=m.offsetHeight; let x=Math.min(r.left,innerWidth-w-8),y=r.bottom+6;
  if(y+hh>innerHeight-8) y=r.top-hh-6; m.style.left=Math.max(8,x)+'px'; m.style.top=y+'px';
}
document.addEventListener('click',e=>{ if(!e.target.closest('#menu')) $('#menu').classList.remove('show'); });

function modal(h){ $('#modal').innerHTML=h; $('#scrim').classList.add('show'); fit(); }
function closeModal(){ inSync=false; $('#scrim').classList.remove('show'); $('#modal').classList.remove('wide'); fit(); }
$('#scrim').addEventListener('mousedown',e=>{ if(e.target.id==='scrim' && !keyBusy) closeModal(); });

function editor(s){
  const isNew=!s; s=s||{id:'',name:'',user:'root',host:'',port:22,color:COLORS[(st.servers.length+3)%COLORS.length]};
  let color=s.color||COLORS[0];
  modal(`<h3>${isNew?t('newServer'):t('editServer')}</h3>
    <div class="f"><label>${t('name')}</label><input id="eName" value="${esc(s.name)}" maxlength="32" placeholder="${t('namePh')}"></div>
    <div class="f two">
      <div><label>${t('user')}</label><input id="eUser" class="ltr" value="${esc(s.user)}" spellcheck="false"></div>
      <div><label>${t('host')}</label><input id="eHost" class="ltr" value="${esc(s.host)}" spellcheck="false" placeholder="1.2.3.4"></div>
      <div><label>${t('port')}</label><input id="ePort" class="ltr" value="${esc(s.port||22)}" inputmode="numeric"></div>
    </div>
    <div class="f"><label>${t('passOpt')}</label><input id="ePass" class="ltr" type="password" placeholder="••••••" autocomplete="off">
      <div class="note" style="margin:6px 0 0">${t('passOptNote')}</div></div>
    <div class="f"><label>${t('tabColor')}</label><div class="sw-row" id="eCol">${COLORS.map(c=>`<span class="swatch ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></span>`).join('')}</div></div>
    <div class="pick ${s.autoTrust?'on':''}" id="eAuto" style="margin:0 0 14px;line-height:1.6"><span class="cb" style="flex:none"></span>${t('autoTrust')}</div>
    <div class="preview" id="ePrev"></div>
    <div class="row"><button class="btn primary" id="eSave">${isNew?t('add'):t('save')}</button><button class="btn" id="eNo">${t('cancel')}</button></div>`);
  const upd=()=>{ const u=$('#eUser').value.trim(),hh=$('#eHost').value.trim(),p=parseInt($('#ePort').value,10)||22;
    $('#ePrev').textContent='ssh '+(p!==22?'-p '+p+' ':'')+(u?u+'@':'')+(hh||'…'); };
  ['#eUser','#eHost','#ePort'].forEach(q=>$(q).addEventListener('input',upd)); upd();
  let auto=!!s.autoTrust; $('#eAuto').onclick=()=>{ auto=!auto; $('#eAuto').classList.toggle('on',auto); };
  $('#eCol').onclick=e=>{ const sw=e.target.closest('.swatch'); if(!sw) return; color=sw.dataset.c;
    document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('sel',x===sw)); };
  const save=async()=>{
    const obj={id:s.id,name:$('#eName').value,user:$('#eUser').value,host:$('#eHost').value,port:parseInt($('#ePort').value,10)||22,color,autoTrust:auto};
    const pw=$('#ePass').value;
    try{ const saved=await window.saveServer(obj); closeModal(); await load(); ping[saved.id]=undefined; render(); window.pingAll();
      if(pw){ runKey(saved.id,pw); } else toast(isNew?t('added'):t('saved')); }
    catch(e){ toast(String(e.message||e),'err',4500); }
  };
  $('#eSave').onclick=save; $('#eNo').onclick=closeModal;

}

let keyBusy=null;
let lastPw='';
async function runKey(id,pw){
  lastPw=pw;
  const s=st.servers.find(x=>x.id===id);
  modal(`<div class="center"><div class="spin"></div><h3>${esc(t('installing',s?s.name:''))}</h3><p>${t('wait')}</p></div>`);

  try{ await window.installKey(id,pw); }
  catch(e){ keyBusy=null; keyResult(id,false,String(e.message||e)); }
}
function keyResult(id,ok,msg){
  const s=st.servers.find(x=>x.id===id)||{name:''};
  if(ok){
    modal(`<div class="center"><div class="okbig">${ICON_KEY}</div><h3>${t('done')}</h3><p>${esc(t('doneMsg',s.name))}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="kOpen">${t('connectNow')}</button><button class="btn" id="kClose">${t('close')}</button></div></div>`);

  } else {
    modal(`<h3>${t('failed')}</h3><p>${esc(msg)}</p>
      <div class="row"><button class="btn primary" id="kRetry">${t('retry')}</button><button class="btn" id="kClose">${t('close')}</button></div>`);
    $('#kRetry').onclick=()=>keyDialog(id); $('#kClose').onclick=closeModal;

}
window.onKey=async(id,ok,msg)=>{ keyBusy=null; lastPw=''; await load(); keyResult(id,ok,msg); };
$('#mKey').onclick=()=>{ $('#menu').classList.remove('show'); keyDialog(menuFor); };

$('#mUp').onclick=async()=>{ $('#menu').classList.remove('show'); await window.moveServer(menuFor,-1); await load(); };
$('#mDown').onclick=async()=>{ $('#menu').classList.remove('show'); await window.moveServer(menuFor,1); await load(); };

$('#lang').onclick=async e=>{ const b=e.target.closest('button'); if(!b||b.dataset.l===lang) return; lang=b.dataset.l; applyLang(); render(); try{ await window.setLang(lang); }catch(x){} };
let sel=null, runSeq=0, runBusy=0, hist=[];
try{ hist=JSON.parse(localStorage.getItem('cmdHist')||'[]'); }catch(e){}
function multiDialog(){
  if(!sel) sel=new Set(st.servers.map(s=>s.id));
  sel=new Set([...sel].filter(id=>st.servers.some(s=>s.id===id)));
  $('#modal').classList.add('wide');
  modal(`<h3>${t('multiTitle')}</h3>
    <div class="sec" style="margin-top:4px">${t('multiPick')} <a href="#" id="pAll" style="color:var(--accent);text-decoration:none">${t('all')}</a><a href="#" id="pNone" style="color:var(--muted);text-decoration:none">${t('none')}</a></div>
    <div class="picks" id="picks">${st.servers.map(s=>`<div class="pick ${sel.has(s.id)?'on':''}" data-id="${esc(s.id)}"><span class="cb"></span><span class="cdot" style="background:${s.color||'#495057'}"></span>${esc(s.name)}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" id="bSplit">${t('splitBtn')}</button><button class="btn" id="bTabs">${t('tabsBtn')}</button></div>
    <div class="note" style="margin:10px 0 0">${t('splitNote')}</div>
    <div class="sec">${t('cmdSec')}</div>
    <div class="cmdrow"><input id="cmd" class="ltr" placeholder="${t('cmdPh')}" spellcheck="false" autocomplete="off"><button class="btn primary" id="bRun">${t('run')}</button></div>
    <div class="note" style="margin:8px 0 0">${t('cmdNote')}</div>
    <div class="results" id="results"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="mClose">${t('close')}</button></div>`);
  $('#modal').classList.add('wide');
  $('#picks').onclick=e=>{ const p=e.target.closest('.pick'); if(!p) return; const id=p.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); p.classList.toggle('on',sel.has(id)); };
  $('#pAll').onclick=e=>{ e.preventDefault(); sel=new Set(st.servers.map(s=>s.id)); document.querySelectorAll('.pick').forEach(p=>p.classList.add('on')); };
  $('#pNone').onclick=e=>{ e.preventDefault(); sel=new Set(); document.querySelectorAll('.pick').forEach(p=>p.classList.remove('on')); };
  const ids=()=>st.servers.filter(s=>sel.has(s.id)).map(s=>s.id);
  $('#bSplit').onclick=async()=>{ if(!sel.size) return toast(t('pickOne'),'err'); try{ await window.openSplit(ids()); }catch(e){ toast(String(e.message||e),'err',4500); } };
  $('#bTabs').onclick=async()=>{ if(!sel.size) return toast(t('pickOne'),'err'); try{ await window.openTabs(ids()); }catch(e){ toast(String(e.message||e),'err',4500); } };
  let hi=-1;
  const cmd=$('#cmd');
  cmd.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); go(); }
    else if(e.key==='ArrowUp'&&hist.length){ e.preventDefault(); hi=Math.min(hi+1,hist.length-1); cmd.value=hist[hi]; }
    else if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.max(hi-1,-1); cmd.value=hi<0?'':hist[hi]; }
  };
  const go=async()=>{
    const c=cmd.value.trim(); if(!c){ cmd.focus(); return; }
    if(!sel.size) return toast(t('pickOne'),'err');
    hist=[c,...hist.filter(x=>x!==c)].slice(0,20); try{ localStorage.setItem('cmdHist',JSON.stringify(hist)); }catch(e){}
    hi=-1;
    const id=++runSeq, list=st.servers.filter(s=>sel.has(s.id));
    $('#results').innerHTML=list.map(s=>`<div class="res" data-r="${esc(s.id)}"><div class="rh"><span class="cdot" style="width:9px;height:9px;border-radius:3px;background:${s.color||'#495057'}"></span><b>${esc(s.name)}</b><span class="rs"><span class="mini"></span>${t('running')}</span></div><pre></pre></div>`).join('');
    runBusy=list.length;
    try{ await window.runMulti(id, list.map(s=>s.id), c); }catch(e){ runBusy=0; toast(String(e.message||e),'err',4500); }
  };
  $('#bRun').onclick=go;
  $('#mClose').onclick=closeModal;
  cmd.focus();
}
window.onRun=r=>{
  if(r.run!==runSeq) return;
  runBusy=Math.max(0,runBusy-1);
  const el=document.querySelector(`.res[data-r="${CSS.escape(r.id)}"]`); if(!el) return;
  const rs=el.querySelector('.rs'), secs=t('secs',fa((r.ms/1000).toFixed(1)));
  if(r.err){ rs.className='rs bad'; rs.textContent=t('errShort')+' · '+secs; const pr=el.querySelector('pre'); pr.textContent=r.err+(r.out?'\n\n'+r.out:''); pr.dir='auto'; pr.style.fontFamily='inherit'; pr.style.textAlign='start'; }
  else { rs.className='rs '+(r.code===0?'ok':'bad'); rs.textContent=(r.code===0?t('exitOk',secs):t('exitBad',fa(r.code))+' · '+secs); el.querySelector('pre').textContent=r.out.replace(/\s+$/,''); }
};
$('#allBtn').onclick=()=>multiDialog();
$('#wMin').onclick=()=>{ try{ window.minimize(); }catch(e){} };
$('#wClose').onclick=()=>{ try{ window.closeApp(); }catch(e){} };
(()=>{
  const hdr=document.querySelector('header');
  let drag=null, raf=0, last=null;
  hdr.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('button,a,input,.lang')) return;
    e.preventDefault();
    drag={x:e.screenX,y:e.screenY,id:e.pointerId};
    hdr.setPointerCapture(e.pointerId);
    try{ window.dragStart(); }catch(x){}
  });
  hdr.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id) return;
    last=[e.screenX-drag.x,e.screenY-drag.y];
    if(!raf) raf=requestAnimationFrame(()=>{ raf=0; if(last){ try{ window.dragMove(last[0],last[1],window.devicePixelRatio||1); }catch(x){} } });
  });
  const end=e=>{ if(!drag) return; try{ hdr.releasePointerCapture(drag.id); }catch(x){} drag=null; };
  hdr.addEventListener('pointerup',end); hdr.addEventListener('pointercancel',end);
})();
window.addEventListener('resize',()=>{ lastFit=''; });
$('#tSame').onclick=async()=>{ st.sameWindow=!st.sameWindow; render(); await window.setOption('sameWindow',st.sameWindow); };
$('#tClose').onclick=async()=>{ st.autoClose=!st.autoClose; render(); await window.setOption('autoClose',st.autoClose); };

// host key changed: o={then:'connect'|'split'|'tabs'|'key', ids:[...], items:[{id,name,addr,fp}]}
window.onHostChanged=o=>{
  keyBusy=null; $('#modal').classList.remove('wide');
  let always=o.items.every(x=>{const s=st.servers.find(y=>y.id===x.id);return s&&s.autoTrust;});
  modal(`<h3>${t('hcTitle')}</h3><p>${t('hcMsg')}</p>
    ${o.items.map(x=>`<div class="res" style="margin-bottom:10px"><div class="rh"><b>${esc(x.name)}</b><span class="rs" style="font-family:var(--mono);direction:ltr">${esc(x.addr)}</span></div>
      <div style="padding:9px 12px 0;font-size:12px;color:var(--muted)">${t('hcFp')}</div><pre style="max-height:none;padding-top:4px">${esc(x.fp)}</pre></div>`).join('')}
    <div class="pick ${always?'on':''}" id="hAlways" style="margin:4px 0 6px;line-height:1.6"><span class="cb" style="flex:none"></span>${t(o.items.length>1?'hcAlwaysN':'hcAlways1')}</div>
    <div class="note" style="margin:0 0 14px">${t('hcAlwaysNote')}</div>
    <div class="row"><button class="btn primary" id="hGo">${t('hcAccept')}</button><button class="btn" id="hNo">${t('cancel')}</button></div>`);
  $('#hAlways').onclick=()=>{ always=!always; $('#hAlways').classList.toggle('on',always); };
  $('#hNo').onclick=()=>{ lastPw=''; closeModal(); };
  $('#hGo').onclick=async()=>{
    try{ await window.trustHost(o.items.map(x=>x.id),always); }catch(e){ toast(String(e.message||e),'err',4500); return; }
    await load();
    if(o.then==='key'){ runKey(o.ids[0],lastPw); return; }
    closeModal(); toast(t('hcDone'));
    try{
      if(o.then==='connect') doConnect(o.ids[0]);
      else if(o.then==='split') await window.openSplit(o.ids);
      else if(o.then==='tabs') await window.openTabs(o.ids);
    }catch(e){ toast(String(e.message||e),'err',4500); }
  };
  $('#hGo').focus();
};
// key login broke after a rebuild
window.onNeedKey=async id=>{
  await load(); const s=st.servers.find(x=>x.id===id); if(!s) return;
  $('#modal').classList.remove('wide');
  modal(`<h3>${esc(t('nkTitle',s.name))}</h3><p>${t('nkMsg')}</p>
    <div class="f"><label>${t('passFor')} <span style="direction:ltr;font-family:var(--mono)">${esc(addr(s))}</span></label><input id="kPass" class="ltr" type="password" autocomplete="off"></div>
    <div class="note">${t('passNote')}</div>

// ---------- sync
let sync={on:false}, syncSt={ok:true}, syncBusy=false, inSync=false;
function syncBadge(){ const b=$('#syncBtn'); b.title=t('syncTip'); b.classList.toggle('on',!!sync.on&&syncSt.ok); b.classList.toggle('err',!!sync.on&&!syncSt.ok&&!syncBusy); b.classList.toggle('busy',syncBusy); }
async function loadSync(){ try{ sync=await window.getSync(); }catch(e){ sync={on:false}; } syncBadge(); }
function ago(ms){ if(!ms) return t('syNever'); const m=Math.round((Date.now()-ms)/60000); if(m<1) return t('justNow'); if(m<60) return t('minAgo',fa(m)); return new Date(ms).toLocaleString(lang==='fa'?'fa-IR':'en-GB',{dateStyle:'short',timeStyle:'short'}); }
window.onSync=async o=>{
  if(o.msg==='busy'){ syncBusy=true; syncBadge(); return; }
  syncBusy=false; syncSt=o; if(o.last) sync.last=o.last; syncBadge();
  if(o.changed){ await load(); doPing(); toast(t('syGot')); }
  if(!o.ok&&o.msg&&inSync) toast(o.msg,'err',6000);
  if(inSync&&sync.on) syncDialog();
};
async function syncDialog(){
  inSync=true; await loadSync();
  if(!sync.on){
    modal(`<h3>${t('syTitle')} <a id="sHelp" style="font-size:12.5px;font-weight:500;margin-inline-start:8px">📖 ${t('syHelp')}</a></h3><p>${t('syIntro')}</p>
      ${sync.login?`<button class="btn ghb" id="sGh"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5Z"/></svg>${t('syLogin')}</button><div class="sec">${t('syOr')}</div>`:''}
      <ol><li>${t('syStep1')} <a id="sMake">${t('syMake')} ↗</a></li><li>${t('syStep2')}</li></ol>
      <div class="f"><input id="sIn" class="ltr" placeholder="${t('syPh')}" spellcheck="false" autocomplete="off"></div>
      <div id="sExist"></div>
      <div class="row"><button class="btn primary" id="sGo">${t('syGo')}</button><button class="btn" id="sNo">${t('cancel')}</button></div>`);
    $('#modal').classList.add('wide'); fit();
    $('#sMake').onclick=()=>window.openURL(sync.tokenURL);
    $('#sHelp').onclick=()=>syncHelp();
    if(sync.login) $('#sGh').onclick=()=>{ $('#sGh').disabled=true; window.loginGitHub(); };
    window.onDevice=(code,uri)=>{
      modal(`<h3>${t('syLogin')}</h3><p>${t('syCode')}</p><div class="ucode">${esc(code)}</div>
        <div class="sstat"><span class="spin" style="width:16px;height:16px;border-width:2px;margin:0;flex:none"></span>${t('syWait')}</div>
        <div class="row"><button class="btn" id="dCopy">${t('syCopy')}</button><button class="btn" id="dOpen">github.com/login/device ↗</button><button class="btn" id="dNo">${t('cancel')}</button></div>`);
      try{ navigator.clipboard.writeText(code); }catch(e){}
      $('#dCopy').onclick=()=>{ try{ navigator.clipboard.writeText(code); }catch(e){} toast(t('syCopied'),'ok'); };
      $('#dOpen').onclick=()=>window.openURL(uri);
      $('#dNo').onclick=()=>{ window.cancelLogin(); syncDialog(); };
    };
    const go=replace=>{ const v=$('#sIn').value.trim(); if(!v&&!replace) return; $('#sGo').disabled=true; $('#sGo').textContent=t('syBusy'); window.setupSync(v,!!replace); };
    $('#sGo').onclick=()=>go(false); $('#sIn').onkeydown=e=>{ if(e.key==='Enter') go(false); };
    $('#sNo').onclick=()=>{ inSync=false; closeModal(); };
    window.onSetup=async(res,msg)=>{
      if(!inSync) return;
      if(!$('#sGo')){ if(res==='exists'||res!=='ok'){ await syncDialog(); } }
      if(!$('#sGo')&&res==='ok'){ toast(msg||t('syDone'),msg?'err':'ok',msg?6000:3000); syncSt={ok:!msg,msg}; await load(); doPing(); syncDialog(); return; }
      $('#sGo').disabled=false; $('#sGo').textContent=t('syGo'); if($('#sGh')) $('#sGh').disabled=false;
      if(res==='exists'){
        $('#sExist').innerHTML=`<p class="note" style="margin:0 0 12px;color:var(--warn)">${t('syExists')}</p><div class="row" style="margin-bottom:12px"><button class="btn danger" id="sRep">${t('syReplace')}</button></div>`;
        $('#sRep').onclick=()=>go(true); fit(); return; }
      if(res!=='ok'){ toast(msg||t('errShort'),'err',6000); return; }
      if(msg) toast(msg,'err',6000); else toast(t('syDone'),'ok');
      syncSt={ok:!msg,msg}; await load(); doPing(); syncDialog();
    };
    $('#sIn').focus(); return;
  }
  const err=!syncSt.ok&&syncSt.msg;
  modal(`<h3>${t('syTitle')} <a id="sHelp" style="font-size:12.5px;font-weight:500;margin-inline-start:8px">📖 ${t('syHelp')}</a></h3>
    <div class="sstat ${err?'err':''}"><span class="d"></span>${err?esc(syncSt.msg):t('syOn')+' · '+t('syLast',ago(sync.last))}</div>
    <p style="margin-bottom:8px">${t('syPhone')}</p>
    ${sync.qr?`<img class="qr" src="${sync.qr}" alt="QR">`:''}
    <div class="linkrow"><input id="sLink" class="ltr" readonly value="${esc(sync.link)}"><button class="btn" id="sCopy">${t('syCopy')}</button></div>
    <p class="note">${t('syWarn')}</p>
    <div class="row"><button class="btn primary" id="sNow" ${syncBusy?'disabled':''}>${syncBusy?t('syBusy'):t('syNow')}</button><button class="btn" id="sClose">${t('close')}</button><span style="flex:1"></span><button class="btn" id="sOff" style="color:var(--danger)">${t('syOff')}</button></div>`);
  $('#modal').classList.add('wide'); fit();
  $('#sCopy').onclick=()=>{ const i=$('#sLink'); i.select(); try{ navigator.clipboard.writeText(i.value); }catch(e){ document.execCommand('copy'); } toast(t('syCopied'),'ok'); };
  $('#sNow').onclick=()=>window.syncNow();
  $('#sHelp').onclick=()=>syncHelp();
  $('#sClose').onclick=()=>{ inSync=false; closeModal(); };
  $('#sOff').onclick=()=>{ modal(`<h3>${t('syOff')}</h3><p>${t('syOffQ')}</p><div class="row"><button class="btn danger" id="oGo">${t('syOff')}</button><button class="btn" id="oNo">${t('cancel')}</button></div>`);
    $('#oGo').onclick=async()=>{ await window.stopSync(); inSync=false; syncSt={ok:true}; closeModal(); loadSync(); };
    $('#oNo').onclick=()=>syncDialog(); };
}
function syncHelp(){ inSync=false;
  modal(`<h3>${t('syHelpT')}</h3><div style="color:var(--muted);font-size:13px;line-height:1.85">${t('syHelpB')}</div><div class="row" style="margin-top:12px"><button class="btn" id="hBack">${t('close')}</button></div>`);
  $('#modal').classList.add('wide'); fit();
  $('#hBack').onclick=()=>syncDialog();
}
$('#syncBtn').onclick=()=>syncDialog();
setInterval(()=>{ if(sync.on&&!syncBusy&&!document.hidden) window.syncNow(); },60000);

window.onToast=(m,k)=>toast(m,k||'',k==='err'?5000:3000);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ $('#menu').classList.remove('show'); if(!keyBusy) closeModal(); return; }
  if($('#scrim').classList.contains('show')) return;
  const n=parseInt(e.key,10); if(n>=1&&n<=9&&st.servers[n-1]) doConnect(st.servers[n-1].id);
  if(e.key==='F5'){ e.preventDefault(); doPing(); }
});

(async()=>{ await load(); if(!st.wtFound) toast(t('noWT'),'',5000); doPing(); await loadSync(); if(sync.on) window.syncNow(); })();
</script>
