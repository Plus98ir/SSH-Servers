name: ssh_servers
description: SSH client for your servers, synced with the SSH Servers app on Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^2.13.0
  xterm: ^4.0.0
  pointycastle: any
  pinenacl: any
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: '>=9.2.2 <11.0.0'
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#0c0f13'
  adaptive_icon_foreground: assets/icon/icon_fg.png
