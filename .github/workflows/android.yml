name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.plus98ir --project-name ssh_servers .
          rm -f test/widget_test.dart

      - name: Patch Android project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 tool/analyze_annotations.py analyze.txt

      - name: Test
        run: |
          flutter test --machine > test.json || true
          python3 tool/test_annotations.py test.json

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SSH-Servers.apk
          ls -la build/app/outputs/flutter-apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSH-Servers-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/SSH-Servers.apk

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/SSH-Servers.apk
