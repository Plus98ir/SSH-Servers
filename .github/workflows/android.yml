name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # Flutter 3.50+ lint calls List.removeLast() (Java 21 API)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.plus98ir --project-name ssh_servers .
          rm -f test/widget_test.dart

      - name: Patch Android project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 tool/analyze_annotations.py analyze.txt

      - name: Test
        run: |
          flutter test --machine > test.json || true
          python3 tool/test_annotations.py test.json

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # version goes up by itself every 10 builds: build 10-19 = 1.1, 20-29 = 1.2 ...
        run: |
          N=${{ github.run_number }}
          V="1.$((N / 10))"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=$N" >> "$GITHUB_ENV"
          flutter build apk --release --build-name="$V" --build-number="$N"
          cd build/app/outputs/flutter-apk
          mv app-release.apk SSH-Servers.apk
          cp SSH-Servers.apk "SSH-Servers-v$V-build$N.apk"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: SSH-Servers-v${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}
          path: mobile/build/app/outputs/flutter-apk/SSH-Servers-v*.apk

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/SSH-Servers.apk
            mobile/build/app/outputs/flutter-apk/SSH-Servers-v${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}.apk
          name: SSH Servers for Android v${{ env.APP_VERSION }} build ${{ env.APP_BUILD }}
          make_latest: false
          body_path: mobile/release-notes.md

      # a release made with GITHUB_TOKEN starts no other workflow: put the new APK on the site
      - name: Update the site downloads
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
