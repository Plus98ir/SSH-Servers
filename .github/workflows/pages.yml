# Publishes docs/ with the release files under dl/, so downloads come from corenetbase.com:
# release-assets.githubusercontent.com (where GitHub's download links go) is blocked in Iran.
name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A release run starts on the tag, but the github-pages environment only deploys from main:
  # hand it over to a run on main instead.
  handoff:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Site + release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r docs _site
          mkdir -p _site/dl
          # Windows exe = the "latest" release (v*); the APK = the newest android-v* release
          gh release download -R "$GITHUB_REPOSITORY" -p SSH.Servers.exe -D _site/dl
          # what the Windows app's update check reads (update.go checkSite)
          gh release view -R "$GITHUB_REPOSITORY" --json tagName,assets,body -q '
            ([.assets[].name | capture("^SSH-Servers-v(?<v>[0-9.]+)-build(?<b>[0-9]+)[.]exe$")] | first) as $m
            | {version: (.tagName | ltrimstr("v")), build: (($m.b // "0") | tonumber), notes: .body, file: "SSH.Servers.exe"}' > _site/dl/windows.json
          cat _site/dl/windows.json
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases -L 50 \
            --json tagName -q '[.[].tagName | select(startswith("android-v"))][0]')
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SSH-Servers.apk -D _site/dl
          # what the Android app's update check reads (mobile/lib/update.dart): version + build from the APK's file name
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,assets,body -q '
            ([.assets[].name | capture("^SSH-Servers-v(?<v>[0-9.]+)-build(?<b>[0-9]+)[.]apk$")] | first) as $m
            | {version: ($m.v // (.tagName | ltrimstr("android-v"))), build: (($m.b // "0") | tonumber), notes: .body, file: "SSH-Servers.apk"}' > _site/dl/android.json
          cat _site/dl/android.json
          ls -l _site/dl
          test -s _site/dl/SSH.Servers.exe && test -s _site/dl/SSH-Servers.apk && test -s _site/dl/windows.json && test -s _site/dl/android.json
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
